<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">Store.</div>
        <button id="cart-toggle-btn" class="cart-btn">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cart-count">0</span>
        </button>
    </header>

    <!-- Main Product Catalog -->
    <main class="store-container">
        <div class="section-title">
            <h2>Latest Drops</h2>
            <p>Elevate your daily essentials.</p>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Dynamic products load here -->
        </div>
    </main>

    <!-- Slide-out Cart Drawer -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button id="close-cart-btn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="cart-items" id="cart-items">
            <!-- Dynamic cart items load here -->
        </div>

        <div class="cart-footer">
            <div class="subtotal-row">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
