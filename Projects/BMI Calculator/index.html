<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bmi-container">
        <h1>BMI Calculator</h1>
        
        <form id="bmi-form">
            <div class="input-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" step="0.1" placeholder="e.g. 70" required>
            </div>

            <div class="input-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" step="0.1" placeholder="e.g. 175" required>
            </div>

            <button type="submit" class="btn">Calculate BMI</button>
        </form>

        <div id="result-container" class="hidden">
            <h2>Your BMI: <span id="bmi-value">0</span></h2>
            <p>Category: <strong id="bmi-category">-</strong></p>
        </div>

        <div class="history-section">
            <h3>Recent Calculations</h3>
            <ul id="history-list"></ul>
            <button id="clear-history" class="btn clear-btn">Clear History</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
