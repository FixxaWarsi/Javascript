<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header class="blog-header">
        <div class="header-content">
            <h1>BLOG.</h1>
            <p>Thoughts, stories, and ideas.</p>
            <button id="open-modal-btn" class="btn-primary"><i class="fa-solid fa-plus"></i> New Post</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="blog-container">
        <!-- Filters / Search -->
        <div class="blog-controls">
            <input type="text" id="search-input" placeholder="Search posts...">
            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="Tech">Tech</option>
                <option value="Design">Design</option>
                <option value="Life">Life</option>
            </select>
        </div>

        <!-- Posts Grid -->
        <div class="posts-grid" id="posts-grid">
            <!-- Dynamic Posts go here -->
        </div>
    </main>

    <!-- New Post Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Create New Post</h2>
                <button id="close-modal-btn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="blog-form">
                <div class="form-group">
                    <label for="post-title">Title</label>
                    <input type="text" id="post-title" required placeholder="Post title">
                </div>
                <div class="form-group">
                    <label for="post-category">Category</label>
                    <select id="post-category">
                        <option value="Tech">Tech</option>
                        <option value="Design">Design</option>
                        <option value="Life">Life</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="post-image">Image URL (Optional)</label>
                    <input type="url" id="post-image" placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-group">
                    <label>Content & Formatting</label>
                    <!-- Formatting Toolbar -->
                    <div class="toolbar">
                        <button type="button" onclick="formatText('bold')"><i class="fa-solid fa-bold"></i></button>
                        <button type="button" onclick="formatText('italic')"><i class="fa-solid fa-italic"></i></button>
                        <button type="button" onclick="formatText('underline')"><i class="fa-solid fa-underline"></i></button>
                    </div>
                    <textarea id="post-content" rows="5" required placeholder="Write your post content here..."></textarea>
                </div>
                
                <button type="submit" class="btn-primary full-width">Publish Post</button>
            </form>
        </div>
    </div>

    <!-- Read Post Modal -->
    <div class="modal-overlay" id="read-modal-overlay">
        <div class="modal read-modal">
            <button id="close-read-btn" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div id="read-image-container"></div>
            <span id="read-category" class="post-category"></span>
            <h2 id="read-title"></h2>
            <p id="read-date" class="post-date"></p>
            <div id="read-body" class="read-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
